name: Deploy Fabric Items via fabric-cicd Python Library

on:
  push:
    branches:
      - main # Chạy tự động khi có code mới đẩy lên nhánh main

jobs:
  fabric-cicd-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Azure Identity & fabric-cicd Package
        run: |
          # Cài đặt thư viện xác thực Azure và thư viện fabric-cicd theo tài liệu
          pip install azure-identity fabric-cicd

      - name: Execute fabric-cicd Deployment Script
        env:
          # Gọi 3 chiếc chìa khóa bí mật từ GitHub Secrets
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # CHÚ Ý: Bạn hãy thay chuỗi GUID giả lập bên dưới bằng Workspace ID thực tế của workspace FabricCICD-TEST
          TARGET_WORKSPACE_ID: "590c8a2f-180c-4e6e-9743-d2b03c1de664"
        run: |
          python -c "
          import os
          from azure.identity import ClientSecretCredential
          from fabric_cicd import FabricWorkspace, publish_all_items, unpublish_all_orphan_items

          # 1. Khởi tạo phương thức xác thực tự động bằng Service Principal
          cred = ClientSecretCredential(
              tenant_id=os.environ['AZURE_TENANT_ID'],
              client_id=os.environ['AZURE_CLIENT_ID'],
              client_secret=os.environ['AZURE_CLIENT_SECRET']
          )

          # 2. Định nghĩa cấu hình môi trường đích TEST dựa trên tài liệu hướng dẫn
          target = FabricWorkspace(
              workspace_id=os.environ['TARGET_WORKSPACE_ID'],
              environment='TEST',
              repository_directory='fabric-cicd-practice', # Tên thư mục chứa code trong Repo của bạn
              item_type_in_scope=['Notebook', 'DataPipeline'], # Chỉ định rõ phạm vi các item cần đồng bộ
              token_credential=cred
          )

          print('--- Bắt đầu triển khai các item định nghĩa vào FabricCICD-TEST ---')
          # 3. Chạy hàm publish toàn bộ cấu trúc item (tự động phát hiện thứ tự phụ thuộc liên kết giữa Notebook và Pipeline)
          publish_all_items(target)
          
          print('--- Triển khai hoàn tất thành công! ---')
          "
